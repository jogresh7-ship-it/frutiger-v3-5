<style>

@media(max-width:760px){

}

<script>
const IMG='https://image.tmdb.org/t/p/';
const TMDB_KEY='3fd2be6f0c70a2a598f084ddfb75487c';
const $=s=>document.querySelector(s),app=$('#app'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let list=store.get('list2',[]),recent=store.get('recent2',[]);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.k);toast.k=setTimeout(()=>t.style.display='none',1800)};
const G=["Action","Adventure","Comedy","Drama","Fantasy","Horror","Mahou Shoujo","Mecha","Music","Mystery","Psychological","Romance","Sci-Fi","Slice of Life","Sports","Supernatural","Thriller"];
const SORTS={POPULARITY_DESC:'Popular',TRENDING_DESC:'Trending',SCORE_DESC:'Top rated',START_DATE_DESC:'Newest',TITLE_ROMAJI:'A–Z'};
const FMT={'':['TV','MOVIE','ONA','TV_SHORT'],TV:['TV','ONA','TV_SHORT'],Movie:['MOVIE']},STAT={Airing:'RELEASING',Completed:'FINISHED'};
const M={};

/* ---------- AniList data ---------- */
const FL='id isAdult siteUrl title{romaji english} episodes seasonYear averageScore genres status format popularity bannerImage nextAiringEpisode{episode} coverImage{extraLarge large}';
const F=FL+' description(asHtml:false)';
const SQ=`query($page:Int,$now:Int){Page(page:$page,perPage:30){pageInfo{hasNextPage} airingSchedules(airingAt_lesser:$now,sort:TIME_DESC,notYetAired:false){episode airingAt media{${FL}}}}}`;
let lastErr='';
async function gql(query,variables){for(let i=0;i<3;i++){try{const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query,variables})});if(r.status===429){await sleep(1500*(i+1));continue}const j=await r.json();if(j.errors)lastErr=j.errors.map(x=>x.message).join('; ');if(j.data)return j.data}catch(e){lastErr=String(e.message||e);await sleep(500)}}return null}
const clean=m=>!m.isAdult&&!/Hentai|Ecchi/.test((m.genres||[]).join());
function norm(m){const e=M[m.id];if(e){if(!e.full&&m.description!==undefined){e.desc=(m.description||'').replace(/<[^>]*>/g,'');e.full=1}return e}const t=m.title.english||m.title.romaji,c=m.coverImage||{};
 return M[m.id]={full:m.description!==undefined,id:m.id,t,t2:m.title.romaji,h:hash(t)%360,genres:(m.genres||[]).slice(0,4),year:m.seasonYear||'',type:m.format==='MOVIE'?'Movie':'TV',
 eps:m.format==='MOVIE'?1:(m.episodes||(m.nextAiringEpisode?Math.max(1,m.nextAiringEpisode.episode-1):12)),status:m.status==='FINISHED'?'Completed':'Airing',
 score:m.averageScore,desc:(m.description||'').replace(/<[^>]*>/g,''),url:m.siteUrl,covers:[c.large,c.extraLarge].filter(Boolean),banners:m.bannerImage?[m.bannerImage]:[]}}
async function fetchList(o){const d=['$page:Int','$per:Int'],v={page:o.page||1,per:o.per||30};
 const args=['type:ANIME','isAdult:false','genre_not_in:["Hentai","Ecchi"]','format_in:['+FMT[o.type||''].join(',')+']','sort:['+(o.q?'SEARCH_MATCH':(SORTS[o.sort]?o.sort:'POPULARITY_DESC'))+']'];
 if(o.min&&+o.min)args.push('averageScore_greater:'+(+o.min));
 if(o.q){d.push('$search:String');v.search=o.q;args.push('search:$search')}
 if(o.genre){d.push('$genre:String');v.genre=o.genre;args.push('genre:$genre')}
 if(STAT[o.status])args.push('status:'+STAT[o.status]);
 const data=await gql(`query(${d.join(',')}){Page(page:$page,perPage:$per){pageInfo{hasNextPage} media(${args.join(',')}){${o.full?F:FL}}}}`,v);
 if(!data)return{items:[],next:false,err:true};return{items:data.Page.media.filter(clean).map(norm),next:data.Page.pageInfo.hasNextPage}}
async function fetchLatest(page){const d=await gql(SQ,{page,now:Math.floor(Date.now()/1000)});if(!d)return{items:[],next:false,err:true};
 return{items:d.Page.airingSchedules.filter(s=>s.media&&clean(s.media)&&s.media.popularity>=800).map(s=>({id:s.media.id,a:norm(s.media),ep:s.episode,at:s.airingAt})),next:d.Page.pageInfo.hasNextPage}}
async function getMany(ids,full){const need=ids.filter(i=>!M[i]||(full&&!M[i].full));if(need.length){const d=await gql(`query($ids:[Int]){Page(perPage:50){media(id_in:$ids,type:ANIME){${F}}}}`,{ids:need});d&&d.Page.media.forEach(norm)}return ids.map(i=>M[i]).filter(Boolean)}
const getAnime=async id=>(await getMany([id],true))[0];

/* ---------- artwork with fallback sources ---------- */
const tget=async u=>{try{return await (await fetch('https://api.themoviedb.org/3'+u+(u.includes('?')?'&':'?')+'api_key='+TMDB_KEY)).json()}catch(e){return{}}};
const normT=x=>String(x||'').toLowerCase().replace(/\b(season|part|cour)\s*\d+\b/g,' ').replace(/\b(the )?animation\b/g,' ').replace(/[^a-z0-9\u3040-\u30ff\u4e00-\u9fff]+/g,' ').trim();
function titleScore(a,r){const mine=[a.t,a.t2].map(normT).filter(Boolean),theirs=[r.name,r.title,r.original_name,r.original_title].map(normT).filter(Boolean);let best=0;
 for(const m of mine)for(const t of theirs){let sc=0;if(m===t)sc=10;else if(t.startsWith(m+' ')||m.startsWith(t+' '))sc=6;else{const A=new Set(m.split(' ')),B=new Set(t.split(' '));let n=0;A.forEach(w=>B.has(w)&&n++);sc=6*n/(A.size+B.size-n)}if(sc>best)best=sc}return best}
function tmdbFind(a){if(!TMDB_KEY)return Promise.resolve(null);return a.tm||(a.tm=(async()=>{
 const kinds=a.type==='Movie'?['movie','tv']:['tv','movie'],qs=[a.t,a.t2].filter((x,i,l)=>x&&l.indexOf(x)===i);
 const res=await Promise.all(kinds.flatMap(kind=>qs.map(async q=>((await tget(`/search/${kind}?query=${encodeURIComponent(q)}`)).results||[]).slice(0,8).map(r=>({kind,...r})))));
 let best=null;
 for(const r of res.flat()){const ts=titleScore(a,r),anim=(r.genre_ids||[]).includes(16),ja=r.original_language==='ja',yr=+String(r.first_air_date||r.release_date||'').slice(0,4);
  const sc=ts+(anim?4:0)+(ja?3:0)+(r.kind===kinds[0]?1:0)+(a.year&&yr&&Math.abs(a.year-yr)<=1?1:0);
  if(!best||sc>best.sc){best={...r,sc,conf:ts>=6&&(anim||ja)}}}
 return best})())}
async function fetchArt(a){
 const q=encodeURIComponent(a.t);
 await Promise.allSettled([
  fetch('https://kitsu.io/api/edge/anime?page[limit]=1&filter[text]='+q).then(r=>r.json()).then(j=>{const k=j.data&&j.data[0]&&j.data[0].attributes;if(!k)return;const p=k.posterImage,c=k.coverImage;if(p&&(p.large||p.original))a.covers.push(p.large||p.original);if(c&&(c.large||c.original))a.banners.push(c.large||c.original)}),
  fetch('https://api.jikan.moe/v4/anime?limit=1&sfw=true&q='+q).then(r=>r.json()).then(j=>{const i=j.data&&j.data[0]&&j.data[0].images&&j.data[0].images.jpg;if(i&&(i.large_image_url||i.image_url))a.covers.push(i.large_image_url||i.image_url)}),
  tmdbFind(a).then(t=>{if(!t)return;if(t.poster_path)a.covers.push(IMG+'w500'+t.poster_path);if(t.backdrop_path)a.banners.push(IMG+'w1280'+t.backdrop_path)})]);
 a.covers.forEach(u=>{if(!a.banners.includes(u))a.banners.push(u)});
}
const needArt=a=>a.art||(a.art=fetchArt(a));
async function artErr(el){const a=M[el.dataset.id];if(!a)return;const L=()=>el.dataset.k==='b'?a.banners:a.covers;const i=+el.dataset.i+1;el.dataset.i=i;
 if(i<L().length){el.src=L()[i];return}await needArt(a);if(i<L().length)el.src=L()[i];else el.remove()}

const needObs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){needObs.unobserve(e.target);e.target.removeAttribute('data-need');artErr(e.target)}}),{rootMargin:'400px'});

 const im=await tget(`/${t.kind}/${t.id}/images?include_image_language=en,ja,null`);
 const rank=x=>x.iso_639_1==='en'?0:x.iso_639_1==='ja'?1:2;
 const l=(im.logos||[]).filter(x=>x.file_path&&!x.file_path.endsWith('.svg')&&x.aspect_ratio>=1).sort((x,y)=>rank(x)-rank(y)||y.vote_average-x.vote_average||y.width-x.width)[0];if(!l)return;

const ago=t=>{const m=Math.max(1,Math.floor((Date.now()/1000-t)/60));return m<60?m+'m ago':m<1440?Math.floor(m/60)+'h ago':Math.floor(m/1440)+'d ago'};

 ns.style.transform='translateX(0)';old.style.transform='translateX(-100%)';post();logos([HERO[hi]]);setTimeout(()=>{old.remove();sliding=false},780)}
async function startHero(items,tok){const hb=$('.hb');if(!hb)return;
 let c=items.filter(a=>a.banners.length).slice(0,8);const rest=items.filter(a=>!a.banners.length).slice(0,6);
 if(!c.length){const f=await Promise.any(rest.map(a=>needArt(a).then(()=>{if(!a.banners.length)throw 0;return a}))).catch(()=>null);if(f)c=[f]}
 if(tok!==rt||!$('.hb'))return;if(!c.length){$('.hb').remove();return}
 HERO=c;hi=0;hb.classList.remove('skel');hb.innerHTML=slideHTML(HERO[0]);post();logos([HERO[0]]);heroT=setInterval(heroGo,6500);
 if(c.length<5)rest.forEach(a=>needArt(a).then(()=>{if(tok===rt&&a.banners.length&&!HERO.includes(a)&&HERO.length<8)HERO.push(a)}))}

/* ---------- infinite feed ---------- */
let rt=0,obs,feed;
function startFeed(mount,getPage,render){const f=feed={page:0,next:true,busy:false,seen:new Set(),n:0},sent=$('#sent');
 async function more(){if(f!==feed||f.busy||!f.next)return;f.busy=true;sent.textContent='Loading…';const r=await getPage(f.page+1);if(f!==feed)return;f.busy=false;f.page++;
  const items=r.items.filter(x=>!f.seen.has(x.id)&&f.seen.add(x.id));f.n+=items.length;mount.insertAdjacentHTML('beforeend',items.map(render).join(''));post();
  f.next=r.next&&!r.err;sent.textContent=f.next?'':(f.n?'You’ve reached the end.':(r.err?'Could not load titles'+(lastErr?' ('+lastErr+')':'')+'. Check your internet connection and reload.':'Nothing matches. Clear a filter or try another title.'));
  if(f.next&&sent.getBoundingClientRect().top<innerHeight+600)more()}
 obs=new IntersectionObserver(e=>{if(e[0].isIntersecting)more()},{rootMargin:'600px'});obs.observe(sent);more()}

function scenePage(){app.innerHTML=`<h2 style="margin-top:40px">Find anime by screenshot</h2><p class="muted" style="max-width:60ch">Upload a screenshot from an episode or movie. trace.moe finds the anime, the episode and the timestamp.</p>
 <div class="drop" id="drop"><input type="file" id="sfile" accept="image/*" hidden><button class="btn" id="spick">Choose image</button><span class="muted">or drop one here, or paste an image link:</span>

 const d=$('#drop'),fi=$('#sfile');$('#spick').onclick=()=>fi.click();fi.onchange=()=>fi.files[0]&&sceneSearch(fi.files[0]);
 $('#sgo').onclick=()=>{const u=$('#surl').value.trim();if(u)sceneSearch(null,u)};
 d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');

async function sceneSearch(file,url){const box=$('#sres');box.innerHTML='<p class="empty">Searching…</p>';
 try{let r;if(file){const fd=new FormData();fd.append('image',file);r=await fetch('https://api.trace.moe/search?anilistInfo&cutBorders',{method:'POST',body:fd})}
  else r=await fetch('https://api.trace.moe/search?anilistInfo&cutBorders&url='+encodeURIComponent(url));
  const j=await r.json();if(j.error)throw new Error(j.error);

  box.innerHTML=res.length?res.map(x=>{const a=x.anilist,t=(a.title&&(a.title.english||a.title.romaji))||'Unknown',m=Math.floor(x.from/60),sc=Math.floor(x.from%60);
   return `<a class="sr" href="#/anime/${a.id}"><video src="${esc(x.video)}" muted loop autoplay playsinline></video><div><b>${esc(t)}</b><div class="muted">Episode ${x.episode||'?'} · ${m}:${String(sc).padStart(2,'0')} · ${(x.similarity*100).toFixed(1)}% match${x.similarity<0.9?' (low confidence)':''}</div></div></a>`}).join(''):'<p class="empty">No match found. Try a clearer screenshot without borders or subtitles.</p>'}
 catch(e){box.innerHTML=`<p class="empty">Couldn’t search (${esc(e.message||e)}). Wait a moment and try again.</p>`}}

 <h2>Anime quotes</h2><div class="filters search2" style="display:flex"><input id="xq" placeholder="Anime title (leave empty for random)" aria-label="Quote anime title"><button class="btn" id="qgo">Get quotes</button></div><div id="xquotes"></div>`;

   if(xs.value==='waifu.pics'){items=(await Promise.all(Array.from({length:n},()=>xImages('waifu.pics',xc.value,1)))).flat()}else items=await xImages(xs.value,xc.value,n);

   $('#xart').insertAdjacentHTML('beforeend',items.map(i=>`<a href="${esc(i.link)}" target="_blank" rel="noopener"><img src="${esc(i.url)}" alt="" loading="lazy"><small>${esc(i.cap)}</small></a>`).join(''));m.textContent=''}
  catch(e){m.textContent='Could not load ('+(e.message||e)+'). The service may be down or rate-limiting you; try again in a moment.'}};
 xs.onchange=()=>{cats();load(true)};xc.onchange=()=>load(true);$('#xgo').onclick=()=>load(false);load(true);

function route(){
 const tok=++rt;clearInterval(heroT);sliding=false;feed=null;if(obs)obs.disconnect();$('#side').classList.remove('open');
 const [r,a,b]=(location.hash.replace(/^#\/?/,'')||'home').split('/'),name=r||'home';

}

addEventListener('hashchange',route);route();

<script>
/* ADSM cursor bridge: hides this page's own cursor and reports the mouse to the parent page (index.html),
   which draws the custom cursor on top. Safe to leave in when the page is opened on its own. */
(function () {
  if (window.parent === window) return;
  var CSS = '*,*::before,*::after{cursor:none !important}';
  function addStyle(d) { try { if (d.__adsmStyle) return; d.__adsmStyle = 1; var s = d.createElement('style'); s.textContent = CSS; (d.head || d.documentElement).appendChild(s); } catch (e) {} }
  function kind(t) {
    if (!t || !t.closest) return 'arrow';
    if (t.closest('button:disabled,[disabled]')) return 'no';
    if (t.closest('input:not([type=button]):not([type=checkbox]):not([type=range]):not([type=radio]):not([type=submit]),textarea,[contenteditable=""],[contenteditable="true"]')) return 'text';
    if (t.closest('a[href],button,select,summary,label,[role="button"],[onclick],.zone-item,[class*="cursor-pointer"]')) return 'hand';
    return 'arrow';
  }
  function send(x, y, k) { window.parent.postMessage({ type: 'fruiti-cursor', x: x, y: y, kind: k }, '*'); }
  function hide() { window.parent.postMessage({ type: 'fruiti-cursor', hide: true }, '*'); }
  var acked = false, docs = [];
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'fruiti-cursor-ack' && !acked) { acked = true; docs.forEach(addStyle); }
  });
  function hook(d, ox) {
    docs.push(d); if (acked) addStyle(d); // own cursor is hidden only once index.html confirms it is drawing the custom one
    d.addEventListener('mousemove', function (e) {
      var r = ox ? ox() : { left: 0, top: 0 };
      send(r.left + e.clientX, r.top + e.clientY, kind(e.target));
    }, true);
    d.addEventListener('mouseleave', hide);
  }
  hook(document);
  // Same-origin child frames (e.g. the game viewer) are followed too
  function hookChild(f) {
    var seen = null;
    setInterval(function () {
      var d = null;
      try { d = f.contentDocument; void d.body; } catch (e) { d = null; }
      if (!d || !d.documentElement || d === seen) return;
      seen = d;
      hook(d, function () { return f.getBoundingClientRect(); });
    }, 500);
  }
  var done = new WeakSet();
  function scan() { document.querySelectorAll('iframe').forEach(function (f) { if (!done.has(f)) { done.add(f); hookChild(f); } }); }
  scan(); setInterval(scan, 700);
})();
</script>
</body>
</html>
