<style>
:root{--bg:#000;--surface:#121214;--line:#26262b;--text:#f2f2f4;--muted:#9a9aa5;--accent:#ff4f7b}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
:root{--sb:232px}
body{padding-left:var(--sb)}
.side{position:fixed;left:12px;top:12px;bottom:12px;width:204px;z-index:6;background:#0c0c0e;border:1px solid var(--line);border-radius:18px;padding:16px 12px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.5)}
nav.main{display:flex;flex-direction:column;gap:6px;color:var(--muted)}
nav.main a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:15px;font-weight:600;transition:background .15s,color .15s}
nav.main a svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav a:hover,nav a.on{color:var(--text)}
nav.main a:hover{background:var(--surface)}
nav.main a.on{background:var(--accent);color:#fff}
.hs{display:flex}.hs input{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 14px;font:inherit;width:100%;border-radius:10px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:700}
.btn.alt{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.burger{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:7;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:18px}
main{max-width:1200px;margin:auto;padding:0 20px 60px;min-height:70vh}
.hero{padding:48px 0 16px}
h1{font-size:clamp(32px,6vw,56px);line-height:1.05;letter-spacing:-1.5px;max-width:14ch}
.hero p{color:var(--muted);max-width:56ch;margin:16px 0 0}
h2{font-size:22px;margin:32px 0 16px;display:flex;justify-content:space-between;align-items:baseline}
h2 small,.muted{font-size:14px;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{display:block;cursor:pointer}
.poster{overflow:hidden;aspect-ratio:2/3;border-radius:10px;position:relative;display:flex;align-items:flex-end;padding:10px;font-weight:800;font-size:34px;line-height:1;color:rgba(255,255,255,.9);border:1px solid var(--line)}
.card:hover .poster{outline:2px solid var(--accent)}
.poster.hl::after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.8));border-radius:0 0 10px 10px;pointer-events:none}
.logo-img{position:absolute;z-index:1;left:8px;bottom:8px;max-width:calc(100% - 16px);max-height:30%;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 2px 6px #000)}
.dlogo{display:block;max-height:120px;max-width:min(420px,100%);object-fit:contain;object-position:left}
html{overflow-x:hidden}
.hb{position:relative;left:50%;margin-left:calc(var(--sb) / 2 - 50vw);width:calc(100vw - var(--sb));height:min(78vh,720px);min-height:420px;overflow:hidden;background:#000}
.hb.skel{background:linear-gradient(120deg,#0e0e12,#1b1b24)}
.slide{position:absolute;inset:0;display:flex;align-items:center;transition:transform .75s cubic-bezier(.65,0,.35,1);will-change:transform;background:#000}
.simg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.88),rgba(0,0,0,.35) 60%,rgba(0,0,0,.05)),linear-gradient(transparent 65%,#000)}
.hbin{position:relative;z-index:1;max-width:1200px;width:100%;margin:auto;padding:48px 20px 60px;color:#fff}
.htitle{font-size:clamp(30px,5vw,56px);max-width:16ch;line-height:1.05;letter-spacing:-1px}
[data-lg] img{display:block;max-height:150px;max-width:min(520px,100%);object-fit:contain;filter:drop-shadow(0 4px 14px rgba(0,0,0,.6))}
.hb .chip{background:rgba(0,0,0,.55);color:#fff;border-color:transparent}
.hdesc{max-width:56ch;color:#e8e8ee;margin:14px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hb .btn.play{background:#fff;color:#000;border-radius:999px;padding:12px 30px;font-size:18px}
.round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.35);color:#fff;font-size:22px;line-height:1;padding:0}
.hb .actions{align-items:center}
.pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.mini{position:relative;overflow:hidden}
.poster.wide{aspect-ratio:16/9;overflow:hidden}
.gb img{width:100%;max-height:320px;object-fit:cover;border-radius:12px;display:block;margin-top:24px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:24px;margin:20px 0;display:flex;flex-wrap:wrap;gap:12px;align-items:center}.drop.over{border-color:var(--accent)}
.search2{display:flex;gap:8px;flex:1 1 320px}.search2 input{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit}
.sr{display:flex;gap:14px;align-items:center;padding:10px;border-bottom:1px solid var(--line);border-radius:8px}.sr:hover{background:var(--surface)}
.sr video{width:200px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#000;flex:none}
@media(max-width:760px){.sr video{width:120px}}
.sent{padding:28px 0;text-align:center;color:var(--muted)}
.cw{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
@media(prefers-reduced-motion:reduce){.slide{transition:none}}
@media(max-width:760px){.hb{height:68vh}[data-lg] img{max-height:100px}}
.badge{z-index:1;position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;background:rgba(0,0,0,.65);color:#fff;border-radius:4px;padding:1px 6px}
.t{margin-top:8px;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:14px}
.chip.on,.chip:hover{border-color:var(--accent);color:var(--accent)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 8px}
select,.filters input{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit}
.pager{display:flex;gap:6px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.pager button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px}.pager .on{border-color:var(--accent);color:var(--accent)}
.rows .row{display:flex;gap:14px;align-items:center;padding:10px;border-bottom:1px solid var(--line);border-radius:8px}
.rows .row:hover{background:var(--surface)}
.rows .mini{width:46px;aspect-ratio:2/3;border-radius:6px;flex:none}
.rows [data-lg] img{max-height:36px;max-width:min(260px,100%);object-position:left;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.rows .grow{flex:1;min-width:0}.rows .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail{display:grid;grid-template-columns:240px 1fr;gap:28px;padding-top:32px}
.detail .poster{font-size:64px}
.detail h1{font-size:clamp(26px,4vw,40px);max-width:none;letter-spacing:-.5px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:7px 16px}.seg .on{background:var(--accent);color:#fff}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.eps a{background:var(--surface);border:1px solid var(--line);border-radius:8px;text-align:center;padding:8px 0}
.eps a:hover,.eps a.on{border-color:var(--accent);color:var(--accent)}
.player{aspect-ratio:16/9;background:#050507;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;margin-top:24px}
.player iframe{width:100%;height:100%;border:0}
.pnav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.empty{color:var(--muted);padding:40px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:20;padding:20px}
.modal.open{display:grid}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(380px,100%)}
.box h3{margin-bottom:14px}.box input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px;margin-bottom:10px;font:inherit}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 18px;border-radius:999px;display:none;z-index:30}
footer{border-top:1px solid var(--line);padding:24px 20px;text-align:center;color:var(--muted);font-size:14px}
footer nav{display:flex;gap:18px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
@media(max-width:760px){
 :root{--sb:0px}
 .burger{display:block}
 .side{left:0;top:0;bottom:0;width:250px;border-radius:0 18px 18px 0;transform:translateX(-110%);transition:transform .25s;padding-top:calc(64px + env(safe-area-inset-top,0px))}
 .side.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.7)}
 .detail{grid-template-columns:1fr}.detail .poster{max-width:200px}
}
.xg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.xg a{display:block;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.xg img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.xg small{display:block;padding:6px 8px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qt{border-left:3px solid var(--accent);padding:8px 14px;margin:12px 0;background:var(--surface);border-radius:0 8px 8px 0}
.qt b{display:block;margin-top:4px;font-size:14px;color:var(--muted);font-weight:400}
.brandlogo{display:flex;align-items:center;justify-content:center;gap:10px;padding:4px 8px 0;font-weight:800;font-size:20px;letter-spacing:-.5px}.brandlogo img{width:44px;height:auto;display:block}
</style>
</head>

const epGrid=(a,cur)=>`<div class="eps">${Array.from({length:Math.min(a.eps,120)},(_,i)=>`<a class="${i+1===cur?'on':''}" href="#/watch/${a.id}/${i+1}">${i+1}</a>`).join('')}</div>${a.eps>120?'<p class="muted" style="margin-top:10px">Showing the first 120 episodes.</p>':''}`;
async function detail(id,tok){app.innerHTML='<p class="empty" style="padding-top:60px">Loading…</p>';const a=await getAnime(id);if(tok!==rt)return;if(!a)return nf();document.title=a.t+' — ani.pm';
 app.innerHTML=`<div class="detail">${poster(a)}<div><h1 data-lg="${a.id}">${a.logo?logoImg(a):esc(a.t)}</h1>
 <div class="meta">${[a.type,a.year,a.status,a.eps+' episodes',a.score?a.score+'% score':''].filter(Boolean).map(m=>`<span class="chip">${m}</span>`).join('')}${a.genres.map(g=>`<a class="chip" href="#/genres/${encodeURIComponent(g)}">${esc(g)}</a>`).join('')}</div>
 <p class="muted" style="max-width:62ch;font-size:16px">${esc(a.desc)||'No description available.'}</p>
 <div class="actions"><a class="btn" href="#/watch/${a.id}/1">Watch episode 1</a><a class="btn alt" target="_blank" rel="noopener" href="${a.url}">Where to watch</a><button class="btn alt" data-add="${a.id}">Add to list</button></div></div></div><h2>Episodes</h2>${epGrid(a)}`;post();logos([a])}
async function watch(id,ep,tok){const a=await getAnime(id);if(tok!==rt)return;ep=+ep||1;if(!a||ep<1||ep>a.eps)return nf();
 recent=recent.filter(r=>r.id!==a.id);recent.unshift({id:a.id,ep});recent=recent.slice(0,12);store.set('recent2',recent);document.title=a.t+' · Ep '+ep;
 app.innerHTML=`<p style="margin-top:28px"><a class="muted" href="#/anime/${a.id}">← ${esc(a.t)}</a></p><h2 style="margin:8px 0 0">Episode ${ep}</h2>
 <div class="player" id="pl"><button class="btn play" id="plBtn" style="position:absolute;inset:0;margin:auto;width:max-content;height:max-content">▶ Play episode ${ep}</button></div>
 <div class="pnav"><a class="btn alt" href="#/watch/${a.id}/${Math.max(1,ep-1)}">Previous</a><a class="btn" href="#/watch/${a.id}/${Math.min(a.eps,ep+1)}">Next</a><a class="btn alt" target="_blank" rel="noopener" href="${a.url}">Where to watch</a></div>
 <h2>Episodes</h2>${epGrid(a,ep)}`;
 $('#plBtn').onclick=()=>{$('#pl').innerHTML=`<iframe src="https://vidly.pro/anime/${a.id}/${ep}" allowfullscreen></iframe>`}}

/* ---------- Search page ---------- */
const sq={q:''};
function searchPage(q){sq.q=q;
 app.innerHTML=`<h2 style="margin-top:40px">Search</h2>
 <form class="search2" id="sp" style="max-width:640px;flex:none"><input id="sqi" type="search" placeholder="Type a title…" value="${esc(q)}" aria-label="Search" autocomplete="off"><button class="btn">Search</button></form>
 <div class="grid" id="bg" style="margin-top:24px"></div><div class="sent" id="sent">${q?'':'Type a title to search.'}</div>`;
 $('#sp').onsubmit=e=>{e.preventDefault();const v=$('#sqi').value.trim(),h='#/search/'+encodeURIComponent(v);if(location.hash===h)route();else location.hash=h};
 if(!q){$('#sqi').focus();return}
 startFeed($('#bg'),pg=>fetchList({q,page:pg}),card)}

function route(){
 const tok=++rt;clearInterval(heroT);sliding=false;feed=null;if(obs)obs.disconnect();$('#side').classList.remove('open');
 const [r,a,b]=(location.hash.replace(/^#\/?/,'')||'home').split('/'),name=r||'home';
 document.title='ani.pm — watch anime free, subbed & dubbed, in HD';scrollTo(0,0);
 document.querySelectorAll('nav.main a').forEach(x=>x.classList.toggle('on',x.dataset.r===name));
 if(name==='home')home(tok);
 else if(name==='browse'){st.genre='';st.q='';browse()}
 else if(name==='genres'){if(a){st.genre=decodeURIComponent(a);st.q='';browse()}else app.innerHTML=`<h2 style="margin-top:40px">Genres</h2>${chipsG()}`}
 else if(name==='search')searchPage(decodeURIComponent(a||''))
 else if(name==='latest')latestPage();
 else if(name==='ghibli'){a?ghibliDetail(a,tok):ghibliPage(tok)}
 else if(name==='scene')scenePage();
 else if(name==='extras')extrasPage();
 else if(name==='list')listPage(tok);
 else if(name==='anime')detail(+a,tok);
 else if(name==='watch')watch(+a,b,tok);
 else nf();
}
$('#burger').onclick=()=>$('#side').classList.toggle('open');
addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();if(location.hash.startsWith('#/search'))$('#sqi')&&$('#sqi').focus();else location.hash='#/search'}});
addEventListener('hashchange',route);route();
</script>
<script>
/* ADSM cursor bridge: hides this page's own cursor and reports the mouse to the parent page (index.html),
   which draws the custom cursor on top. Safe to leave in when the page is opened on its own. */
(function () {
  if (window.parent === window) return;
  var CSS = '*,*::before,*::after{cursor:none !important}';
  function addStyle(d) { try { if (d.__adsmStyle) return; d.__adsmStyle = 1; var s = d.createElement('style'); s.textContent = CSS; (d.head || d.documentElement).appendChild(s); } catch (e) {} }
  function kind(t) {
    if (!t || !t.closest) return 'arrow';
    if (t.closest('button:disabled,[disabled]')) return 'no';
    if (t.closest('input:not([type=button]):not([type=checkbox]):not([type=range]):not([type=radio]):not([type=submit]),textarea,[contenteditable=""],[contenteditable="true"]')) return 'text';
    if (t.closest('a[href],button,select,summary,label,[role="button"],[onclick],.zone-item,[class*="cursor-pointer"]')) return 'hand';
    return 'arrow';
  }
  function send(x, y, k) { window.parent.postMessage({ type: 'fruiti-cursor', x: x, y: y, kind: k }, '*'); }
  function hide() { window.parent.postMessage({ type: 'fruiti-cursor', hide: true }, '*'); }
  var acked = false, docs = [];
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'fruiti-cursor-ack' && !acked) { acked = true; docs.forEach(addStyle); }
  });
  function hook(d, ox) {
    docs.push(d); if (acked) addStyle(d); // own cursor is hidden only once index.html confirms it is drawing the custom one
    d.addEventListener('mousemove', function (e) {
      var r = ox ? ox() : { left: 0, top: 0 };
      send(r.left + e.clientX, r.top + e.clientY, kind(e.target));
    }, true);
    d.addEventListener('mouseleave', hide);
  }
  hook(document);
  // Same-origin child frames (e.g. the game viewer) are followed too
  function hookChild(f) {
    var seen = null;
    setInterval(function () {
      var d = null;
      try { d = f.contentDocument; void d.body; } catch (e) { d = null; }
      if (!d || !d.documentElement || d === seen) return;
      seen = d;
      hook(d, function () { return f.getBoundingClientRect(); });
    }, 500);
  }
  var done = new WeakSet();
  function scan() { document.querySelectorAll('iframe').forEach(function (f) { if (!done.has(f)) { done.add(f); hookChild(f); } }); }
  scan(); setInterval(scan, 700);
})();
</script>
