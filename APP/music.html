<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @font-face {
            font-family: 'GNF Regular';
            src: url('APPFONT/gnf.regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body, input, button, select, textarea {
            font-family: 'GNF Regular', 'Inter', sans-serif;
        }

        body {
            background-color: transparent;
            color: #ffffff;
            margin: 0;
            padding: 0;
            width: 100vw;
            overflow-x: hidden;
        }

        /* High-Definition PNG Rendering & Enhanced Styling */
        img {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        .png-enhanced {
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6)) contrast(1.08) brightness(1.05);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), filter 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            backface-visibility: hidden;
            transform: translateZ(0);
        }

        .png-enhanced:hover {
            filter: drop-shadow(0 4px 12px rgba(255, 255, 255, 0.3)) contrast(1.15) brightness(1.1);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-36 w-full bg-transparent text-[#ffffff]">

    <header class="sticky top-0 z-40 bg-black/30 backdrop-blur-md border-b border-white/10 px-0 py-3.5 w-full">
        <div class="w-full px-4 flex items-center justify-between">
            <form id="search-form" onsubmit="handleSearchSubmit(event)" class="relative flex items-center w-full gap-2">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <img src="stars.png" alt="Search" class="w-4 h-4 opacity-80 png-enhanced">
                </div>
                <input type="text" id="search-input" placeholder="Search songs, artists, or albums..." 
                    class="w-full pl-11 pr-32 py-3 bg-black/40 backdrop-blur-md border border-white/20 rounded-2xl text-sm text-[#ffffff] placeholder-[#a3a3a3] focus:outline-none focus:border-white/50 focus:ring-1 focus:ring-white/30 transition shadow-inner">
                <button type="submit" class="absolute right-1.5 px-6 py-2 bg-[#ffffff] hover:bg-[#e5e5e5] text-[#000000] font-medium text-xs rounded-xl transition active:scale-95 shadow-md flex items-center gap-1.5">
                    <img src="stars.png" alt="Stars" class="w-3.5 h-3.5 object-contain png-enhanced">
                    <span>Search</span>
                </button>
            </form>
        </div>
    </header>

    <main class="flex-1 w-full px-0 py-2">
        
        <!-- Welcome state view -->
        <div id="welcome-state" class="w-full"></div>

        <!-- Loading spinner state -->
        <div id="loading-state" class="hidden text-center py-32 w-full">
            <div class="inline-block relative">
                <div class="w-10 h-10 rounded-full border-2 border-white/20 border-t-white animate-spin"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <i data-lucide="music-2" class="w-4 h-4 text-white/70"></i>
                </div>
            </div>
            <p class="text-[#a3a3a3] text-sm font-medium tracking-wide mt-4">Searching music library...</p>
        </div>

        <!-- Search results list -->
        <div id="results-container" class="hidden w-full px-4">
            <div class="flex items-center justify-between mb-3 px-2">
                <h3 class="text-xs font-semibold text-[#a3a3a3] uppercase tracking-wider flex items-center gap-1.5">
                    <i data-lucide="list-music" class="w-4 h-4 text-white/80"></i>
                    Search Results (<span id="result-count">0</span>)
                </h3>
            </div>
            <div id="results-list" class="w-full space-y-2">
                <!-- Dynamically injected full-width song rows -->
            </div>
            
            <!-- Load More Button -->
            <div id="load-more-container" class="mt-6 text-center hidden pb-4">
                <button id="btn-load-more" onclick="loadMoreResults()" class="px-6 py-2.5 bg-black/40 hover:bg-black/70 border border-white/20 hover:border-white/40 text-xs font-medium text-[#ffffff] rounded-xl transition-all duration-200 backdrop-blur-md active:scale-95 shadow-lg inline-flex items-center gap-2">
                    <i data-lucide="arrow-down-circle" class="w-4 h-4"></i>
                    <span>Load More Songs</span>
                </button>
            </div>
        </div>

    </main>

    <div class="fixed bottom-0 left-0 right-0 z-50 bg-black/50 backdrop-blur-xl border-t border-white/10 w-full px-4 py-4 shadow-[0_-10px_25px_rgba(0,0,0,0.5)]">
        <div class="w-full flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- Track Details & Cover -->
            <div class="flex items-center space-x-3.5 w-full md:w-1/3">
                <div class="relative w-14 h-14 rounded-2xl overflow-hidden bg-black/40 backdrop-blur-md border border-white/20 flex-shrink-0 shadow-[0_4px_20px_rgba(255,255,255,0.08)] flex items-center justify-center group hover:border-white/40 transition-all duration-300">
                    <img id="player-cover" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M9 18V5l12-2v13'/><circle cx='6' cy='18' r='3'/><circle cx='18' cy='16' r='3'/></svg>" alt="Cover" class="w-full h-full object-cover p-2.5 opacity-90 transition duration-300 group-hover:scale-105 png-enhanced" onerror="this.src=FALLBACK_ICON">
                </div>
                <div class="min-w-0 flex-1">
                    <h4 id="player-title" class="text-sm font-medium text-[#ffffff] truncate tracking-tight">No track selected</h4>
                    <p id="player-artist" class="text-xs text-[#a3a3a3] truncate mt-0.5">Search and select a song to play</p>
                </div>
            </div>

            <!-- Playback Controls, Repeat & Timeline -->
            <div class="flex flex-col items-center w-full md:w-1/3 space-y-2">
                <div class="flex items-center space-x-6">
                    <button id="btnLoop" class="relative text-[#a3a3a3] hover:text-[#ffffff] transition-all duration-200 active:scale-90 p-1.5 rounded-lg hover:bg-white/10" title="Loop Forever">
                        <i data-lucide="repeat" class="w-4 h-4"></i>
                        <span id="loopIndicator" class="hidden absolute bottom-0.5 left-1/2 -translate-x-1/2 w-1 h-1 bg-white rounded-full shadow-[0_0_5px_#fff]"></span>
                    </button>
                    <button id="btnRewind" class="text-[#a3a3a3] hover:text-[#ffffff] transition-all duration-200 active:scale-90 p-1.5 rounded-lg hover:bg-white/10" title="Previous Track">
                        <i data-lucide="skip-back" class="w-4 h-4"></i>
                    </button>
                    <button id="btnPlayPause" class="w-11 h-11 rounded-2xl bg-[#ffffff] hover:bg-[#e5e5e5] text-[#000000] flex items-center justify-center transition-all duration-200 shadow-[0_0_20px_rgba(255,255,255,0.25)] hover:shadow-[0_0_25px_rgba(255,255,255,0.45)] hover:scale-105 active:scale-95">
                        <span id="playIcon" class="flex items-center justify-center">
                            <i data-lucide="play" class="w-4 h-4 ml-0.5 fill-black"></i>
                        </span>
                    </button>
                    <button id="btnForward" class="text-[#a3a3a3] hover:text-[#ffffff] transition-all duration-200 active:scale-90 p-1.5 rounded-lg hover:bg-white/10" title="Next Track">
                        <i data-lucide="skip-forward" class="w-4 h-4"></i>
                    </button>
                </div>
                <div class="w-full flex items-center space-x-3 text-xs text-[#a3a3a3] font-mono">
                    <span id="currentTime">0:00</span>
                    <input type="range" id="progressBar" value="0" max="100" class="w-full h-1 bg-white/20 rounded-full appearance-none cursor-pointer accent-[#ffffff] hover:bg-white/30 transition">
                    <span id="duration">0:00</span>
                </div>
            </div>

            <!-- Volume Control -->
            <div class="flex items-center justify-end space-x-3 w-full md:w-1/3">
                <button id="btnMute" onclick="toggleMute()" class="text-[#a3a3a3] hover:text-[#ffffff] transition active:scale-90 p-1">
                    <i id="volumeIcon" data-lucide="volume-2" class="w-4 h-4"></i>
                </button>
                <input type="range" id="volume-bar" min="0" max="1" step="0.05" value="0.8" class="w-24 h-1 bg-white/20 rounded-full appearance-none cursor-pointer accent-[#ffffff] hover:bg-white/30 transition" oninput="setVolume(this.value)">
            </div>
        </div>
    </div>

    <script>
        let currentTracksList = [];
        let currentIndex = -1;
        let isLooping = false;
        let currentPage = 1;
        let currentSearchQuery = '';
        let previousVolume = 0.8;

        const FALLBACK_ICON = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M9 18V5l12-2v13'/><circle cx='6' cy='18' r='3'/><circle cx='18' cy='16' r='3'/></svg>";
        const CACHE_KEY = 'monochrome_music_backup_cache';

        let audio = document.getElementById('musicAppAudio');
        if (!audio) {
            audio = document.createElement('audio');
            audio.id = 'musicAppAudio';
            audio.src = 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';
            audio.preload = 'auto';
            audio.loop = false;
            document.body.appendChild(audio);
        }
        audio.volume = 0.8;

        const trackInfo = {
            title: 'Lo-Fi Chill Stream',
            artist: 'Frutiger Audio',
            coverUrl: FALLBACK_ICON,
            audioSrc: audio.src
        };

        function sendActivationToParent() {
            try {
                window.parent.postMessage({
                    type: 'activateMusic',
                    audioSrc: trackInfo.audioSrc,
                    coverUrl: trackInfo.coverUrl,
                    title: trackInfo.title,
                    artist: trackInfo.artist
                }, '*');
            } catch(e) {}
        }

        const defaultBackupDatabase = [
            { id: '1', name: 'Falling', artist: 'Trevor Daniel', pic: FALLBACK_ICON, url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
            { id: '2', name: 'Blinding Lights', artist: 'The Weeknd', pic: FALLBACK_ICON, url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
            { id: '3', name: 'Sunflower', artist: 'Post Malone, Swae Lee', pic: FALLBACK_ICON, url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' },
            { id: '4', name: 'Levitating', artist: 'Dua Lipa', pic: FALLBACK_ICON, url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3' },
            { id: '5', name: 'Stay', artist: 'The Kid LAROI, Justin Bieber', pic: FALLBACK_ICON, url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3' }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initializeLocalStorageCache();

            const playBtn = document.getElementById('btnPlayPause');
            const playIcon = document.getElementById('playIcon');
            const rewindBtn = document.getElementById('btnRewind');
            const forwardBtn = document.getElementById('btnForward');
            const loopBtn = document.getElementById('btnLoop');
            const loopIndicator = document.getElementById('loopIndicator');
            const progressBar = document.getElementById('progressBar');
            const currentTimeEl = document.getElementById('currentTime');
            const durationEl = document.getElementById('duration');

            audio.addEventListener('loadedmetadata', () => {
                if (durationEl) durationEl.textContent = formatTime(audio.duration);
            });

            audio.addEventListener('timeupdate', () => {
                if (audio.duration && progressBar) {
                    progressBar.value = (audio.currentTime / audio.duration) * 100;
                    if (currentTimeEl) currentTimeEl.textContent = formatTime(audio.currentTime);
                    if (durationEl) durationEl.textContent = formatTime(audio.duration);
                }
            });

            if (progressBar) {
                progressBar.addEventListener('input', () => {
                    if (audio.duration) {
                        audio.currentTime = (progressBar.value / 100) * audio.duration;
                    }
                });
            }

            function togglePlay() {
                if (currentIndex !== -1 && currentTracksList.length > 0) {
                    if (audio.paused) {
                        audio.play().then(() => {
                            sendActivationToParent();
                            if (playIcon) playIcon.innerHTML = '<i data-lucide="pause" class="w-4 h-4 fill-black"></i>';
                            lucide.createIcons();
                        }).catch(err => console.log("Playback error:", err));
                    } else {
                        audio.pause();
                        if (playIcon) playIcon.innerHTML = '<i data-lucide="play" class="w-4 h-4 ml-0.5 fill-black"></i>';
                        lucide.createIcons();
                    }
                } else {
                    if (audio.paused) {
                        audio.play().then(() => {
                            sendActivationToParent();
                            if (playIcon) playIcon.innerHTML = '<i data-lucide="pause" class="w-4 h-4 fill-black"></i>';
                            lucide.createIcons();
                        }).catch(err => console.log("Playback error:", err));
                    } else {
                        audio.pause();
                        if (playIcon) playIcon.innerHTML = '<i data-lucide="play" class="w-4 h-4 ml-0.5 fill-black"></i>';
                        lucide.createIcons();
                    }
                }
            }

            if (playBtn) playBtn.addEventListener('click', togglePlay);
            if (rewindBtn) rewindBtn.addEventListener('click', () => { 
                if (currentIndex !== -1 && currentTracksList.length > 0) {
                    previousTrack();
                } else {
                    audio.currentTime = Math.max(0, audio.currentTime - 5); 
                }
            });
            if (forwardBtn) forwardBtn.addEventListener('click', () => { 
                if (currentIndex !== -1 && currentTracksList.length > 0) {
                    nextTrack();
                } else {
                    audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5); 
                }
            });
            
            if (loopBtn) {
                loopBtn.addEventListener('click', () => {
                    audio.loop = !audio.loop;
                    isLooping = audio.loop;
                    loopBtn.classList.toggle('text-white', audio.loop);
                    loopBtn.classList.toggle('text-[#a3a3a3]', !audio.loop);
                    if (loopIndicator) loopIndicator.classList.toggle('hidden', !audio.loop);
                });
            }

            audio.addEventListener('ended', () => {
                if (!audio.loop && currentIndex !== -1 && currentTracksList.length > 0) {
                    if (currentIndex < currentTracksList.length - 1) {
                        nextTrack();
                    } else {
                        if (playIcon) playIcon.innerHTML = '<i data-lucide="play" class="w-4 h-4 ml-0.5 fill-black"></i>';
                        lucide.createIcons();
                    }
                }
            });

            window.addEventListener('message', (event) => {
                const data = event.data;
                if (!data || !data.action) return;

                switch (data.action) {
                    case 'rewind':
                        audio.currentTime = Math.max(0, audio.currentTime - 5);
                        break;
                    case 'playPause':
                        togglePlay();
                        break;
                    case 'forward':
                        audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
                        break;
                    case 'loop':
                        audio.loop = !audio.loop;
                        isLooping = audio.loop;
                        if (loopBtn) {
                            loopBtn.classList.toggle('text-white', audio.loop);
                            loopBtn.classList.toggle('text-[#a3a3a3]', !audio.loop);
                            if (loopIndicator) loopIndicator.classList.toggle('hidden', !audio.loop);
                        }
                        break;
                }
            });
        });

        function initializeLocalStorageCache() {
            if (!localStorage.getItem(CACHE_KEY)) {
                localStorage.setItem(CACHE_KEY, JSON.stringify(defaultBackupDatabase));
            }
        }

        function handleSearchSubmit(e) {
            e.preventDefault();
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;
            currentSearchQuery = query;
            currentPage = 1;
            executeSearch(query, 1);
        }

        function loadMoreResults() {
            if (!currentSearchQuery) return;
            currentPage++;
            executeSearch(currentSearchQuery, currentPage);
        }

        async function executeSearch(query, page = 1) {
            const btnLoadMore = document.getElementById('btn-load-more');
            
            if (page === 1) {
                showState('loading');
                currentTracksList = [];
            } else if (btnLoadMore) {
                btnLoadMore.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Loading...</span>';
                btnLoadMore.disabled = true;
                lucide.createIcons();
            }

            let newTracks = [];
            const encodedQuery = encodeURIComponent(query);

            // 1. MAIN API: GDStudio NetEase API
            try {
                const res1 = await fetch(`https://music-api.gdstudio.xyz/api.php?types=search&count=30&page=${page}&source=netease&name=${encodedQuery}`, { mode: 'cors' });
                if (res1.ok) {
                    const data1 = await res1.json();
                    let rawList1 = Array.isArray(data1) ? data1 : (data1.data || data1.result || []);
                    if (Array.isArray(rawList1) && rawList1.length > 0) {
                        newTracks = rawList1.map((item, idx) => ({
                            id: item.id || idx,
                            name: item.name || item.title || 'Unknown Title',
                            artist: item.artist || item.author || 'Unknown Artist',
                            pic: (item.pic || item.cover) ? (item.pic || item.cover) : FALLBACK_ICON,
                            url: item.url || null
                        }));
                    }
                }
            } catch (err) {}

            // 2. BACKUP API: iTunes Search API
            if (newTracks.length === 0 && page === 1) {
                try {
                    const res2 = await fetch(`https://itunes.apple.com/search?entity=song&term=${encodedQuery}&limit=100`, { mode: 'cors' });
                    if (res2.ok) {
                        const data2 = await res2.json();
                        if (data2 && Array.isArray(data2.results) && data2.results.length > 0) {
                            newTracks = data2.results.map((item, idx) => ({
                                id: item.trackId || idx,
                                name: item.trackName || 'Unknown Title',
                                artist: item.artistName || 'Unknown Artist',
                                pic: item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '300x300bb') : FALLBACK_ICON,
                                url: item.previewUrl || null
                            }));
                        }
                    }
                } catch (err) {}
            }

            // 3. FALLBACK: Local Cache or Default Database
            if (newTracks.length === 0 && page === 1) {
                try {
                    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]');
                    const q = query.toLowerCase();
                    newTracks = cached.filter(s => s.name.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q));
                    if (newTracks.length === 0) newTracks = cached;
                } catch (e) {
                    newTracks = defaultBackupDatabase;
                }
            }

            if (page === 1) {
                currentTracksList = newTracks;
                try {
                    if (newTracks.length > 0) {
                        localStorage.setItem(CACHE_KEY, JSON.stringify(newTracks));
                    }
                } catch (e) {}
            } else {
                currentTracksList = [...currentTracksList, ...newTracks];
            }

            if (btnLoadMore) {
                btnLoadMore.innerHTML = '<i data-lucide="arrow-down-circle" class="w-4 h-4"></i><span>Load More Songs</span>';
                btnLoadMore.disabled = false;
            }

            renderResults(currentTracksList, newTracks.length >= 30);
        }

        function showState(stateName) {
            document.getElementById('welcome-state').classList.add('hidden');
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('results-container').classList.add('hidden');

            if (stateName === 'welcome') document.getElementById('welcome-state').classList.remove('hidden');
            if (stateName === 'loading') document.getElementById('loading-state').classList.remove('hidden');
            if (stateName === 'results') document.getElementById('results-container').classList.remove('hidden');
        }

        function renderResults(tracks, hasMore = true) {
            const listEl = document.getElementById('results-list');
            document.getElementById('result-count').textContent = tracks.length;
            
            const loadMoreContainer = document.getElementById('load-more-container');
            if (loadMoreContainer) {
                if (hasMore) {
                    loadMoreContainer.classList.remove('hidden');
                } else {
                    loadMoreContainer.classList.add('hidden');
                }
            }

            listEl.innerHTML = '';

            tracks.forEach((track, index) => {
                const itemNumber = index + 1;
                const div = document.createElement('div');
                div.className = "group w-full flex items-center justify-between px-4 py-3 bg-black/40 hover:bg-black/70 border border-white/10 hover:border-white/30 rounded-2xl backdrop-blur-md transition-all duration-200 cursor-pointer shadow-sm hover:shadow-lg";
                div.onclick = () => playTrackIndex(index);
                
                const coverImg = (track.pic && track.pic !== '') ? track.pic : FALLBACK_ICON;

                div.innerHTML = `
                    <div class="flex items-center space-x-4 min-w-0 flex-1">
                        <span class="w-8 text-center text-xs font-semibold text-[#a3a3a3] group-hover:text-[#ffffff] transition">${itemNumber}</span>
                        <div class="relative w-12 h-12 rounded-xl overflow-hidden bg-black/50 flex-shrink-0 border border-white/10 shadow-inner flex items-center justify-center">
                            <img src="${coverImg}" alt="${track.name}" class="w-full h-full object-cover group-hover:scale-110 transition duration-300 png-enhanced ${coverImg === FALLBACK_ICON ? 'p-2.5 opacity-80' : ''}" onerror="this.src='${FALLBACK_ICON}'; this.className='w-full h-full object-cover p-2.5 opacity-80 png-enhanced';">
                        </div>
                        <div class="min-w-0 flex-1 pr-4">
                            <h4 class="text-sm font-medium text-[#ffffff] truncate group-hover:text-[#e5e5e5] tracking-tight">${track.name}</h4>
                            <p class="text-xs text-[#a3a3a3] truncate mt-0.5">${track.artist}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 flex-shrink-0 pl-3">
                        <div class="w-10 h-10 rounded-xl bg-white/10 group-hover:bg-[#ffffff] text-[#ffffff] group-hover:text-[#000000] flex items-center justify-center transition-all duration-200 border border-white/10 group-hover:border-[#ffffff] shadow-sm group-hover:scale-105">
                            <i data-lucide="play" class="w-4 h-4 ml-0.5 fill-current"></i>
                        </div>
                    </div>
                `;
                listEl.appendChild(div);
            });

            showState('results');
            lucide.createIcons();
        }

        async function playTrackIndex(index) {
            if (index < 0 || index >= currentTracksList.length) return;
            currentIndex = index;
            const track = currentTracksList[index];

            document.getElementById('player-title').textContent = track.name;
            document.getElementById('player-artist').textContent = track.artist;
            const activeCover = (track.pic && track.pic !== '') ? track.pic : FALLBACK_ICON;
            const playerCoverEl = document.getElementById('player-cover');
            playerCoverEl.src = activeCover;
            if (activeCover === FALLBACK_ICON) {
                playerCoverEl.className = 'w-full h-full object-cover p-2.5 opacity-80 png-enhanced';
            } else {
                playerCoverEl.className = 'w-full h-full object-cover png-enhanced';
            }

            trackInfo.title = track.name;
            trackInfo.artist = track.artist;
            trackInfo.coverUrl = activeCover;

            let streamUrl = track.url;
            const cleanRid = track.id;

            if (!streamUrl && cleanRid) {
                try {
                    const res = await fetch(`https://music-api.gdstudio.xyz/api.php?types=url&id=${cleanRid}&source=netease`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.url) streamUrl = data.url;
                    }
                } catch (e) {}
            }

            audio.src = streamUrl || track.url || 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';
            trackInfo.audioSrc = audio.src;

            try {
                await audio.play();
                sendActivationToParent();
                updatePlayPauseButton(true);
            } catch (err) {
                updatePlayPauseButton(false);
            }
        }

        function updatePlayPauseButton(isPlaying) {
            const playIcon = document.getElementById('playIcon');
            if (playIcon) {
                playIcon.innerHTML = isPlaying ? '<i data-lucide="pause" class="w-4 h-4 fill-black"></i>' : '<i data-lucide="play" class="w-4 h-4 ml-0.5 fill-black"></i>';
            }
            lucide.createIcons();
        }

        function setVolume(val) {
            audio.volume = val;
            updateVolumeIcon(val);
        }

        function toggleMute() {
            if (audio.volume > 0) {
                previousVolume = audio.volume;
                setVolume(0);
                document.getElementById('volume-bar').value = 0;
            } else {
                setVolume(previousVolume || 0.8);
                document.getElementById('volume-bar').value = previousVolume || 0.8;
            }
        }

        function updateVolumeIcon(val) {
            const volumeIcon = document.getElementById('volumeIcon');
            if (!volumeIcon) return;
            const numVal = parseFloat(val);
            let iconName = 'volume-2';
            if (numVal === 0) iconName = 'volume-x';
            else if (numVal < 0.5) iconName = 'volume-1';

            volumeIcon.setAttribute('data-lucide', iconName);
            lucide.createIcons();
        }

        function nextTrack() {
            if (currentTracksList.length === 0) return;
            let nextIdx = currentIndex + 1;
            if (nextIdx >= currentTracksList.length) nextIdx = 0;
            playTrackIndex(nextIdx);
        }

        function previousTrack() {
            if (currentTracksList.length === 0) return;
            let prevIdx = currentIndex - 1;
            if (prevIdx < 0) prevIdx = currentTracksList.length - 1;
            playTrackIndex(prevIdx);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>
</body>
</html>
