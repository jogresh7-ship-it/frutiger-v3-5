    /* Second Custom TTF Font Integration */
    @font-face {

      font-style: normal;

    /* Force global application of Gnf font across all elements except exempted headers */
    html, body, div, span, p, a, button, input, label, aside, nav {

    }

    input::placeholder {
      color: #666666;
      font-family: 'Gnf', 'Inter', sans-serif;
    }
  </style>

  <script>
    const CURRENT_NEWS_KEY = 'v3_update1_new_gui'; 
    const SAVED_NEWS_KEY = localStorage.getItem('fruitiger_news_key') || '';
    const SAVED_WALLPAPER = localStorage.getItem('fruitiger_wallpaper') || '';
    const SAVED_LOOP_SETTING = localStorage.getItem('fruitiger_video_loop') !== 'false';
    const SAVED_TITLE = localStorage.getItem('fruitiger_tab_title') || 'fruti';
    const SAVED_FAVICON = localStorage.getItem('fruitiger_tab_favicon') || 'https://img.icons8.com/?size=100&id=1iF9PyJ2Thzo&format=png&color=FFFFFF';

    document.title = SAVED_TITLE;
    let favEl = document.getElementById('dynamicFavicon');
    if (favEl) favEl.href = SAVED_FAVICON;

    let currentUsername = localStorage.getItem('fruitiger_username') || 'username';
    function updateUsernameDisplay(name) {
      currentUsername = name || 'username';
      localStorage.setItem('fruitiger_username', currentUsername);
      const initialEl = document.getElementById('userInitial');
      if (initialEl) {
        initialEl.textContent = currentUsername.charAt(0).toUpperCase();
      }
    }

    let currentProfileDeco = localStorage.getItem('fruitiger_profile_deco') || 'https://cherrion.top/elements/pfpdeco/whiteroses.png';

    function updateProfileDecoDisplay(url) {
      currentProfileDeco = url;
      localStorage.setItem('fruitiger_profile_deco', currentProfileDeco);
      
      const profileBtn = document.querySelector('[data-nav-id="profile"]');
      if (profileBtn) {
        let decoImg = profileBtn.querySelector('img');
        if (currentProfileDeco) {
          if (!decoImg) {
            decoImg = document.createElement('img');
            decoImg.className = 'absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[46px] h-[46px] pointer-events-none object-contain z-20';
            profileBtn.insertBefore(decoImg, profileBtn.firstChild);
          }
          decoImg.src = currentProfileDeco;
          decoImg.style.display = 'block';
        } else if (decoImg) {
          decoImg.style.display = 'none';
        }
      }
    }

    const appUrls = {
      browser: 'https://scramjet-3ze9e92vg-jjjkijjih-9771.vercel.app/',
      chat: 'https://stratus-chatroom-development.vercel.app/',
      games: 'APP/gamehub.html',
      music: 'APP/music.html',
      movies: 'https://school-rgb.github.io/frutimovies/',
      anime: 'https://school-rgb.github.io/anime-movies-in-html/'
    };

    let activeIndex = 0;
    let isAppLoading = false;
    let canvas, ctx;
    let particles = [];
    let mouse = { x: -1000, y: -1000, radius: 120 };

    class Particle {
      constructor(w, h) {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8;
        this.size = Math.random() * 2 + 1.2;
      }
      update(w, h) {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > w) this.vx *= -1;
        if (this.y < 0 || this.y > h) this.vy *= -1;

        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < mouse.radius) {
          const angle = Math.atan2(dy, dx);
          const force = (mouse.radius - dist) / mouse.radius;
          this.x -= Math.cos(angle) * force * 3;
          this.y -= Math.sin(angle) * force * 3;
        }
      }
      draw(ctx) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initCanvas() {
      canvas = document.getElementById('bgCanvas');
      if (!canvas) return;
      ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      particles = [];
      const particleCount = Math.floor((window.innerWidth * window.innerHeight) / 14000);
      for (let i = 0; i < Math.max(30, Math.min(particleCount, 80)); i++) {
        particles.push(new Particle(canvas.width, canvas.height));
      }

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });
      window.addEventListener('mouseleave', () => {
        mouse.x = -1000;
        mouse.y = -1000;
      });

      animateCanvas();
    }

    function animateCanvas() {
      if (!ctx || !canvas) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (activeIndex === 0 || isAppLoading) {
        for (let i = 0; i < particles.length; i++) {
          particles[i].update(canvas.width, canvas.height);
          particles[i].draw(ctx);
        }

        for (let a = 0; a < particles.length; a++) {
          for (let b = a + 1; b < particles.length; b++) {
            const dx = particles[a].x - particles[b].x;
            const dy = particles[a].y - particles[b].y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 120) {
              const alpha = (1 - dist / 120) * 0.35;
              ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
              ctx.lineWidth = 0.9;
              ctx.beginPath();
              ctx.moveTo(particles[a].x, particles[a].y);
              ctx.lineTo(particles[b].x, particles[b].y);
              ctx.stroke();
            }
          }
        }
      }
      requestAnimationFrame(animateCanvas);
    }

    function applyWallpaper(url, isVideo, loopEnabled) {
      const canvasEl = document.getElementById('bgCanvas');
      const layer = document.getElementById('wallpaperLayer');
      if (!canvasEl || !layer) return;

      if (!url) {
        canvasEl.classList.remove('hidden');
        layer.classList.add('hidden');
        layer.innerHTML = '';
        localStorage.removeItem('fruitiger_wallpaper');
        return;
      }

      canvasEl.classList.add('hidden');
      layer.classList.remove('hidden');
      layer.innerHTML = '';

      if (isVideo) {
        const vid = document.createElement('video');
        vid.src = url;
        vid.className = 'w-full h-full object-cover';
        vid.autoplay = true;
        vid.muted = true;
        vid.playsInline = true;
        vid.loop = loopEnabled;

      const ctrlLoop = document.getElementById('ctrlLoop');

      let musicActivated = false;
      let musicHideTimeout = null;

      globalAudio.pause();

      window.addEventListener('message', (event) => {
        const data = event.data;
        if (!data) return;

        if (data.type === 'activateMusic') {
          musicActivated = true;
          if (activeIndex !== 4) {
            musicThumbContainer.classList.remove('hidden');
            musicThumbContainer.classList.add('flex');
          }
        }
        if (data.audioSrc && globalAudio.src !== data.audioSrc) {
          globalAudio.src = data.audioSrc;
          globalAudio.pause();
          ctrlPlayIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        }
        if (data.coverUrl && sidebarMusicImg) {
          sidebarMusicImg.src = data.coverUrl;
        }
        if (data.action === 'playPause') {
          toggleGlobalPlay();
        } else if (data.action === 'rewind') {
          globalAudio.currentTime = Math.max(0, globalAudio.currentTime - 5);
        } else if (data.action === 'forward') {
          globalAudio.currentTime = Math.min(globalAudio.duration || 0, globalAudio.currentTime + 5);
        } else if (data.action === 'loop') {
          globalAudio.loop = !globalAudio.loop;
          ctrlLoop.classList.toggle('text-white', globalAudio.loop);
        }
      });

      function toggleGlobalPlay() {
        if (globalAudio.paused) {
          globalAudio.play().catch(() => {});
          ctrlPlayIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        } else {
          globalAudio.pause();
          ctrlPlayIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        }
      }

      if (ctrlPlayPause) ctrlPlayPause.addEventListener('click', (e) => { e.stopPropagation(); toggleGlobalPlay(); });
      if (ctrlRewind) ctrlRewind.addEventListener('click', (e) => { e.stopPropagation(); globalAudio.currentTime = Math.max(0, globalAudio.currentTime - 5); });
      if (ctrlForward) ctrlForward.addEventListener('click', (e) => { e.stopPropagation(); globalAudio.currentTime = Math.min(globalAudio.duration || 0, globalAudio.currentTime + 5); });
      if (ctrlLoop) ctrlLoop.addEventListener('click', (e) => { e.stopPropagation(); globalAudio.loop = !globalAudio.loop; ctrlLoop.classList.toggle('text-white', globalAudio.loop); });

      if (musicThumbContainer && musicControlsPanel) {

          if (musicHideTimeout) clearTimeout(musicHideTimeout);

          musicControlsPanel.classList.add('flex');

        const hidePanel = () => {
          musicHideTimeout = setTimeout(() => {
            musicControlsPanel.classList.remove('flex');
            musicControlsPanel.classList.add('hidden');
          }, 1000);
        };
        musicThumbContainer.addEventListener('mouseenter', showPanel);
        musicThumbContainer.addEventListener('mouseleave', hidePanel);

        musicControlsPanel.addEventListener('mouseleave', hidePanel);

      const stHours = document.getElementById('stHours');
      const stMinutes = document.getElementById('stMinutes');

      function updateClockAndStream() {
        const now = new Date();
        let rawHours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const period = rawHours >= 12 ? 'PM' : 'AM';
        rawHours = rawHours % 12;
        rawHours = rawHours ? rawHours : 12;
        const hours = String(rawHours).padStart(2, '0');

        stHours.textContent = hours;
        stMinutes.textContent = minutes;
        stPeriod.textContent = period;
        stMonth1.textContent = allMonths[now.getMonth()].slice(0, 2);
        stMonth2.textContent = (allMonths[now.getMonth()].slice(2, 3) + ' ').slice(0, 2);
        stDay.textContent = String(now.getDate()).padStart(2, '0');
        stYear.textContent = String(now.getFullYear()).slice(-2);

        if (activeIndex === 0) {
          heroTitle.textContent = daysOfWeek[now.getDay()];
          heroDate.textContent = `${allMonths[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
        }

            const grid = document.getElementById('githubWallpapersGrid');
            if (grid) {
              grid.innerHTML = '<span class="text-[10px] text-mono-400 col-span-2 text-center py-4 px-2">School Wi-Fi restrictions detected. GitHub API requests are blocked. Default particle backgrounds and custom cloaks remain fully functional.</span>';
            }
          });

        document.getElementById('presetGoogle').addEventListener('click', () => {
          updateTabInfo('Google', 'https://www.google.com/favicon.ico');
        });
        document.getElementById('presetDrive').addEventListener('click', () => {
          updateTabInfo('My Drive - Google Drive', 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png');
        });
        document.getElementById('presetCanvas').addEventListener('click', () => {
          updateTabInfo('Dashboard', 'https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico');
        });
        document.getElementById('applyTabCustom').addEventListener('click', () => {
          updateTabInfo(document.getElementById('tabTitleInput').value, document.getElementById('tabIconInput').value);
        });
      }

      navButtons.forEach((btn, index) => {
        btn.addEventListener('click', () => setNavIndex(index));
        btn.addEventListener('mouseenter', () => {
          tooltipText.textContent = btn.getAttribute('data-subtitle');
          const btnRect = btn.getBoundingClientRect();
          tooltip.style.top = `${btnRect.top + (btnRect.height / 2) - 12}px`;
          tooltip.classList.remove('opacity-0', 'pointer-events-none');
          tooltip.classList.add('opacity-100');
        });
        btn.addEventListener('mouseleave', () => {
          tooltip.classList.add('opacity-0', 'pointer-events-none');
          tooltip.classList.remove('opacity-100');
        });
      });

      setNavIndex(0);
    });
