  <style>
    /* Custom OTF Font Integration */
    @font-face {
      font-family: 'Electroharmonix';
      src: url('Electroharmonix.otf') format('opentype'),
           url('https://db.onlinewebfonts.com/t/7946caedfe3335bf3bfdcf66dfc1ed44.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* Second Custom TTF Font Integration */
    @font-face {
      font-family: 'Gnf';
      src: url('gnf.regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    .font-electro {
      font-family: 'Electroharmonix', 'Inter', system-ui, sans-serif;
      letter-spacing: 0.15em;
    }

    /* Black text outline effect for homepage */
    .text-outline {
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 
                   0px -1px 0 #000, 0px 1px 0 #000, -1px 0px 0 #000, 1px 0px 0 #000;
    }

    /* Glassy frosted card effect matching updated GUI style */
    .glass-card {
      background: rgba(16, 16, 16, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* Force global application of Gnf font across all elements except exempted headers */
    html, body, div, span, p, a, button, input, label, aside, nav {
      font-family: 'Gnf', 'Inter', system-ui, sans-serif;
    }

    /* Explicit exemption for header elements */
    #heroTitle, #welcomeSubtitle {
      font-family: 'Electroharmonix', 'Inter', system-ui, sans-serif !important;
    }

    html, body {
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #050505;
    }

    @keyframes fastPartialFade {
      0% { opacity: 1; transform: scale(1); }
      35% { opacity: 0.22; transform: scale(0.988); }
      100% { opacity: 1; transform: scale(1); }
    }

    .animate-fast-fade {
      animation: fastPartialFade 0.22s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }


    /* ===== Native cursor fully hidden; ADSM cursor is drawn by #adsmCursor ===== */
    html, body, *, *::before, *::after { cursor: none !important; }
    #adsmCursor { position: fixed; left: 0; top: 0; z-index: 2147483647; pointer-events: none; display: none; background-repeat: no-repeat; will-change: transform; }

    input::placeholder {
      color: #666666;
      font-family: 'Gnf', 'Inter', sans-serif;
    }
  </style>

  <!-- Application JavaScript Logic -->
  <script>
    const CURRENT_NEWS_KEY = 'v6_cursor_no_profile'; 
    // Profile + chat system removed: wipe any previously stored profile data
    ['fruitiger_username','fruitiger_profile_deco','fruitiger_setup_key','fruiti_chat_uid'].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });

    const SAVED_NEWS_KEY = localStorage.getItem('fruitiger_news_key') || '';
    const SAVED_WALLPAPER = localStorage.getItem('fruitiger_wallpaper') || '';
    const SAVED_LOOP_SETTING = localStorage.getItem('fruitiger_video_loop') !== 'false';
    const SAVED_TITLE = localStorage.getItem('fruitiger_tab_title') || 'fruti';
    const SAVED_FAVICON = localStorage.getItem('fruitiger_tab_favicon') || 'https://img.icons8.com/?size=100&id=1iF9PyJ2Thzo&format=png&color=FFFFFF';

    document.title = SAVED_TITLE;
    let favEl = document.getElementById('dynamicFavicon');
    if (favEl) favEl.href = SAVED_FAVICON;


    const appUrls = {
      browser: 'https://scramjet-app-gamma.vercel.app/',
      games: 'APP/gamehub.html',
      music: 'APP/music.html',
      movies: 'https://school-rgb.github.io/frutimovies/',
      anime: 'https://manga-api-tonedot-blue.vercel.app/'
    };

    let activeIndex = 0;
    let isAppLoading = false;
    let canvas, ctx;
    let particles = [];
    let mouse = { x: -1000, y: -1000, radius: 120 };

    class Particle {
      constructor(w, h) {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8;
        this.size = Math.random() * 2 + 1.2;
      }
      update(w, h) {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > w) this.vx *= -1;
        if (this.y < 0 || this.y > h) this.vy *= -1;

        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < mouse.radius) {
          const angle = Math.atan2(dy, dx);
          const force = (mouse.radius - dist) / mouse.radius;
          this.x -= Math.cos(angle) * force * 3;
          this.y -= Math.sin(angle) * force * 3;
        }
      }
      draw(ctx) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initCanvas() {
      canvas = document.getElementById('bgCanvas');
      if (!canvas) return;
      ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      particles = [];
      const particleCount = Math.floor((window.innerWidth * window.innerHeight) / 14000);
      for (let i = 0; i < Math.max(30, Math.min(particleCount, 80)); i++) {
        particles.push(new Particle(canvas.width, canvas.height));
      }

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });
      window.addEventListener('mouseleave', () => {
        mouse.x = -1000;
        mouse.y = -1000;
      });

      animateCanvas();
    }

    function animateCanvas() {
      if (!ctx || !canvas) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (activeIndex === 0 || isAppLoading) {
        for (let i = 0; i < particles.length; i++) {
          particles[i].update(canvas.width, canvas.height);
          particles[i].draw(ctx);
        }

        for (let a = 0; a < particles.length; a++) {
          for (let b = a + 1; b < particles.length; b++) {
            const dx = particles[a].x - particles[b].x;
            const dy = particles[a].y - particles[b].y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 120) {
              const alpha = (1 - dist / 120) * 0.35;
              ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
              ctx.lineWidth = 0.9;
              ctx.beginPath();
              ctx.moveTo(particles[a].x, particles[a].y);
              ctx.lineTo(particles[b].x, particles[b].y);
              ctx.stroke();
            }
          }
        }
      }
      requestAnimationFrame(animateCanvas);
    }

    function applyWallpaper(url, isVideo, loopEnabled) {
      const canvasEl = document.getElementById('bgCanvas');
      const layer = document.getElementById('wallpaperLayer');
      if (!canvasEl || !layer) return;

      if (!url) {
        canvasEl.classList.remove('hidden');
        layer.classList.add('hidden');
        layer.innerHTML = '';
        localStorage.removeItem('fruitiger_wallpaper');
        return;
      }

      canvasEl.classList.add('hidden');
      layer.classList.remove('hidden');
      layer.innerHTML = '';

      if (isVideo) {
        const vid = document.createElement('video');
        vid.src = url;
        vid.className = 'w-full h-full object-cover';
        vid.autoplay = true;
        vid.muted = true;
        vid.playsInline = true;
        vid.loop = loopEnabled;
        layer.appendChild(vid);
      } else {
        const img = document.createElement('div');
        img.className = 'w-full h-full bg-cover bg-center bg-no-repeat';
        img.style.backgroundImage = `url('${url}')`;
        layer.appendChild(img);
      }
      localStorage.setItem('fruitiger_wallpaper', url);
    }

    document.addEventListener('DOMContentLoaded', () => {
      initCanvas();

      const newsModal = document.getElementById('newsModal');
      const closeNewsBtn = document.getElementById('closeNewsBtn');
      const newsModalBtn = document.getElementById('newsModalBtn');

      if (SAVED_NEWS_KEY !== CURRENT_NEWS_KEY) {
        newsModal.classList.remove('hidden');
      }

      closeNewsBtn.addEventListener('click', () => {
        newsModal.classList.add('hidden');
        localStorage.setItem('fruitiger_news_key', CURRENT_NEWS_KEY);
      });

      newsModalBtn.addEventListener('click', () => {
        newsModal.classList.remove('hidden');
      });

      if (SAVED_WALLPAPER) {
        const isVideo = SAVED_WALLPAPER.toLowerCase().endsWith('.mp4');
        applyWallpaper(SAVED_WALLPAPER, isVideo, SAVED_LOOP_SETTING);
      }

      const sidebar = document.getElementById('sidebar');
      const navButtons = Array.from(document.querySelectorAll('.nav-btn'));
      const tooltip = document.getElementById('tooltip');
      const tooltipText = document.getElementById('tooltipText');
      const mainContainer = document.getElementById('mainContainer');
      const mainDisplay = document.getElementById('mainDisplay');
      const heroTitle = document.getElementById('heroTitle');
      const heroDate = document.getElementById('heroDate');
      const welcomeSubtitle = document.getElementById('welcomeSubtitle');
      const sectionContent = document.getElementById('sectionContent');
      const sidebarMusicImg = document.getElementById('sidebarMusicImg');

      const globalAudio = document.getElementById('globalAudio');
      const musicThumbContainer = document.getElementById('musicThumbContainer');
      const musicControlsPanel = document.getElementById('musicControlsPanel');
      const ctrlPlayPause = document.getElementById('ctrlPlayPause');
      const ctrlPlayIcon = document.getElementById('ctrlPlayIcon');
      const ctrlRewind = document.getElementById('ctrlRewind');
      const ctrlForward = document.getElementById('ctrlForward');
      const ctrlLoop = document.getElementById('ctrlLoop');

      let musicActivated = false;
      let musicHideTimeout = null;

      globalAudio.pause();

      window.addEventListener('message', (event) => {
        const data = event.data;
        if (!data) return;

        if (data.type === 'activateMusic') {
          musicActivated = true;
          if (navButtons[activeIndex] && navButtons[activeIndex].getAttribute('data-subtitle') !== 'MUSIC') {
            musicThumbContainer.classList.remove('hidden');
            musicThumbContainer.classList.add('flex');
          }
        }
        if (data.audioSrc && globalAudio.src !== data.audioSrc) {
          globalAudio.src = data.audioSrc;
          globalAudio.pause();
          ctrlPlayIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        }
        if (data.coverUrl && sidebarMusicImg) {
          sidebarMusicImg.src = data.coverUrl;
        }
        if (data.action === 'playPause') {
          toggleGlobalPlay();
        } else if (data.action === 'rewind') {
          globalAudio.currentTime = Math.max(0, globalAudio.currentTime - 5);
        } else if (data.action === 'forward') {
          globalAudio.currentTime = Math.min(globalAudio.duration || 0, globalAudio.currentTime + 5);
        } else if (data.action === 'loop') {
          globalAudio.loop = !globalAudio.loop;
          ctrlLoop.classList.toggle('text-white', globalAudio.loop);
        }
      });

      function toggleGlobalPlay() {
        if (globalAudio.paused) {
          globalAudio.play().catch(() => {});
          ctrlPlayIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        } else {
          globalAudio.pause();
          ctrlPlayIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        }
      }

      if (ctrlPlayPause) ctrlPlayPause.addEventListener('click', (e) => { e.stopPropagation(); toggleGlobalPlay(); });
      if (ctrlRewind) ctrlRewind.addEventListener('click', (e) => { e.stopPropagation(); globalAudio.currentTime = Math.max(0, globalAudio.currentTime - 5); });
      if (ctrlForward) ctrlForward.addEventListener('click', (e) => { e.stopPropagation(); globalAudio.currentTime = Math.min(globalAudio.duration || 0, globalAudio.currentTime + 5); });
      if (ctrlLoop) ctrlLoop.addEventListener('click', (e) => { e.stopPropagation(); globalAudio.loop = !globalAudio.loop; ctrlLoop.classList.toggle('text-white', globalAudio.loop); });

      if (musicThumbContainer && musicControlsPanel) {
        const showPanel = () => {
          if (musicHideTimeout) clearTimeout(musicHideTimeout);
          musicControlsPanel.classList.remove('hidden');
          musicControlsPanel.classList.add('flex');
        };
        const hidePanel = () => {
          musicHideTimeout = setTimeout(() => {
            musicControlsPanel.classList.remove('flex');
            musicControlsPanel.classList.add('hidden');
          }, 1000);
        };
        musicThumbContainer.addEventListener('mouseenter', showPanel);
        musicThumbContainer.addEventListener('mouseleave', hidePanel);
        musicControlsPanel.addEventListener('mouseenter', showPanel);
        musicControlsPanel.addEventListener('mouseleave', hidePanel);
      }

      const stHours = document.getElementById('stHours');
      const stMinutes = document.getElementById('stMinutes');
      const stPeriod = document.getElementById('stPeriod');
      const stMonth1 = document.getElementById('stMonth1');
      const stMonth2 = document.getElementById('stMonth2');
      const stDay = document.getElementById('stDay');
      const stYear = document.getElementById('stYear');

      const daysOfWeek = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
      const allMonths = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];

      function updateClockAndStream() {
        const now = new Date();
        let rawHours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const period = rawHours >= 12 ? 'PM' : 'AM';
        rawHours = rawHours % 12;
        rawHours = rawHours ? rawHours : 12;
        const hours = String(rawHours).padStart(2, '0');

        stHours.textContent = hours;
        stMinutes.textContent = minutes;
        stPeriod.textContent = period;
        stMonth1.textContent = allMonths[now.getMonth()].slice(0, 2);
        stMonth2.textContent = (allMonths[now.getMonth()].slice(2, 3) + ' ').slice(0, 2);
        stDay.textContent = String(now.getDate()).padStart(2, '0');
        stYear.textContent = String(now.getFullYear()).slice(-2);

        if (activeIndex === 0) {
          heroTitle.textContent = daysOfWeek[now.getDay()];
          heroDate.textContent = `${allMonths[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
        }
      }
      updateClockAndStream();
      setInterval(updateClockAndStream, 1000);

      function setNavIndex(index) {
        if (index < 0 || index >= navButtons.length) return;
        activeIndex = index;
        const targetBtn = navButtons[activeIndex];
        const subtitle = targetBtn.getAttribute('data-subtitle');

        navButtons.forEach(btn => {
          btn.classList.remove('bg-white/20', 'text-white');
          btn.classList.add('text-mono-400');
        });
        targetBtn.classList.remove('text-mono-400');
        targetBtn.classList.add('bg-white/20', 'text-white');

        mainDisplay.classList.remove('animate-fast-fade');
        void mainDisplay.offsetWidth;
        mainDisplay.classList.add('animate-fast-fade');

        if (subtitle === 'MUSIC') {
          musicThumbContainer.classList.remove('flex');
          musicThumbContainer.classList.add('hidden');
          if (!globalAudio.paused) {
            globalAudio.pause();
            ctrlPlayIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
          }
        } else {
          if (musicActivated) {
            musicThumbContainer.classList.remove('hidden');
            musicThumbContainer.classList.add('flex');
            if (globalAudio.paused && globalAudio.src) {
              globalAudio.play().catch(() => {});
              ctrlPlayIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
            }
          }
        }

        const now = new Date();
        if (subtitle === 'HOME') {
          isAppLoading = false;
          mainContainer.className = "flex-1 h-screen bg-transparent flex flex-col items-center justify-center text-center p-0 relative overflow-hidden z-10";
          mainDisplay.className = "flex flex-col items-center justify-center w-full h-full z-10";
          heroTitle.textContent = daysOfWeek[now.getDay()];
          heroTitle.classList.remove('hidden');
          heroDate.textContent = `${allMonths[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
          heroDate.classList.remove('hidden');
          welcomeSubtitle.textContent = 'WELCOME TO FRUITIGER';
          welcomeSubtitle.classList.remove('hidden');
          sectionContent.className = "w-full h-full hidden";
        } else if (['BROWSER', 'GAMES', 'MUSIC', 'MOVIES', 'ANIME'].includes(subtitle)) {
          isAppLoading = true;
          mainContainer.className = "flex-1 h-screen bg-transparent flex flex-col items-center justify-center relative overflow-hidden p-0 z-10";
          mainDisplay.className = "w-full h-full z-10 flex flex-col items-center justify-center relative";
          heroTitle.classList.add('hidden');
          heroDate.classList.add('hidden');
          welcomeSubtitle.classList.add('hidden');
          sectionContent.className = "w-full h-full block relative flex items-center justify-center";

          const targetUrl = appUrls[subtitle.toLowerCase()];
          sectionContent.innerHTML = `
            <div id="appLoader" class="absolute inset-0 bg-black/40 backdrop-blur-md z-30 flex flex-col items-center justify-center font-mono gap-3 transition-opacity duration-300">
              <div class="w-8 h-8 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>
              <span class="text-xs tracking-[0.3em] text-white font-bold uppercase">LOADING ${subtitle}...</span>
            </div>
            <iframe id="appIframe" src="${targetUrl}" class="w-full h-full border-0 relative z-10 opacity-0 transition-opacity duration-300" title="${subtitle}" loading="lazy"></iframe>
          `;

          const iframeEl = document.getElementById('appIframe');
          const loaderEl = document.getElementById('appLoader');

          if (subtitle === 'MUSIC' && targetBtn.querySelector('img')) {
            sidebarMusicImg.src = targetBtn.querySelector('img').src;
          }

          const handleLoaded = () => {
            setTimeout(() => {
              isAppLoading = false;
              if (loaderEl) loaderEl.classList.add('opacity-0', 'pointer-events-none');
              if (iframeEl) iframeEl.classList.remove('opacity-0');
            }, 500);
          };

          iframeEl.addEventListener('load', handleLoaded);
          setTimeout(handleLoaded, 2500);

        } else if (subtitle === 'SETTINGS') {
          isAppLoading = false;
          mainContainer.className = "flex-1 h-screen bg-transparent flex flex-col items-center justify-start text-center p-8 relative overflow-y-auto z-10 select-text";
          mainDisplay.className = "w-full max-w-xl flex flex-col items-center justify-start pt-12 gap-6 text-center mx-auto";
          heroTitle.classList.add('hidden');
          heroDate.classList.add('hidden');
          welcomeSubtitle.classList.add('hidden');
          sectionContent.className = "w-full block";
          renderSettingsView();
        }
      }

      function updateTabInfo(title, iconUrl) {
        if (title) {
          document.title = title;
          localStorage.setItem('fruitiger_tab_title', title);
        }
        if (iconUrl) {
          let favicon = document.getElementById('dynamicFavicon');
          if (!favicon) {
            favicon = document.createElement('link');
            favicon.id = 'dynamicFavicon';
            favicon.rel = 'icon';
            document.head.appendChild(favicon);
          }
          favicon.href = iconUrl;
          localStorage.setItem('fruitiger_tab_favicon', iconUrl);
        }
      }

      function renderSettingsView() {
        const currentTitle = document.title;
        const currentFavicon = document.getElementById('dynamicFavicon')?.href || '';
        let currentLoop = localStorage.getItem('fruitiger_video_loop') !== 'false';

        sectionContent.innerHTML = `
          <div class="w-full flex flex-col items-center text-center space-y-6 text-xs tracking-wider pb-12 mx-auto">
            
            <div class="text-mono-400 uppercase tracking-[0.25em] text-[11px] font-semibold border-b border-white/10 pb-2 w-full max-w-md text-center">
              TAB CLOAKING & CUSTOMIZATION (GUI v1)
            </div>

            <!-- Quick Presets -->
            <div class="flex flex-col items-center gap-2 w-full max-w-md">
              <span class="text-[10px] text-mono-500 uppercase tracking-widest">QUICK CLOAK PRESETS</span>
              <div class="grid grid-cols-3 gap-2 w-full">
                <button id="presetGoogle" class="px-2 py-2 glass-card hover:border-white rounded-md text-[10px] text-mono-200 transition-colors font-bold cursor-pointer">GOOGLE</button>
                <button id="presetDrive" class="px-2 py-2 glass-card hover:border-white rounded-md text-[10px] text-mono-200 transition-colors font-bold cursor-pointer">DRIVE</button>
                <button id="presetCanvas" class="px-2 py-2 glass-card hover:border-white rounded-md text-[10px] text-mono-200 transition-colors font-bold cursor-pointer">CANVAS</button>
              </div>
            </div>

            <!-- Custom Title & Favicon Input -->
            <div class="flex flex-col gap-3 w-full max-w-md text-left pt-1">
              <label class="flex flex-col gap-1">
                <span class="text-[10px] text-mono-400 uppercase font-semibold">CUSTOM TAB TITLE</span>
                <input id="tabTitleInput" type="text" value="${currentTitle}" placeholder="e.g. Google Search" class="glass-card rounded-md px-3 py-2 text-xs text-white focus:outline-none focus:border-white">
              </label>

              <label class="flex flex-col gap-1">
                <span class="text-[10px] text-mono-400 uppercase font-semibold">CUSTOM FAVICON URL</span>
                <input id="tabIconInput" type="text" value="${currentFavicon}" placeholder="https://example.com/favicon.ico" class="glass-card rounded-md px-3 py-2 text-xs text-white focus:outline-none focus:border-white">
              </label>

              <button id="applyTabCustom" class="mt-2 w-full py-2.5 bg-white text-black font-bold text-xs uppercase rounded-md hover:bg-mono-200 active:scale-95 transition-all cursor-pointer">
                APPLY TAB CLOAK
              </button>
            </div>

            <div class="text-mono-400 uppercase tracking-[0.25em] text-[11px] font-semibold border-b border-white/10 pb-2 pt-4 w-full max-w-md text-center">
              WALLPAPERS
            </div>

            <!-- Video Loop Toggle Setting -->
            <div class="flex items-center justify-between w-full max-w-md px-3 py-2 glass-card rounded-md">
              <span class="text-[10px] text-mono-300 font-semibold uppercase">VIDEO LOOPING</span>
              <button id="loopToggleBtn" class="px-3 py-1 bg-[#1a1a1a] hover:bg-[#252525] border border-white/10 rounded text-[10px] font-bold text-white transition-colors cursor-pointer">
                ${currentLoop ? 'ENABLED' : 'DISABLED'}
              </button>
            </div>

            <!-- Background Selector Section -->
            <div class="flex flex-col items-center gap-3 w-full max-w-md">
              <button id="bgDefaultBtn" class="w-full py-2 glass-card hover:border-white rounded-md text-white font-bold cursor-pointer">
                DEFAULT (PARTICLE DOTS)
              </button>
              <div id="githubWallpapersGrid" class="grid grid-cols-2 gap-2 w-full max-h-48 overflow-y-auto p-1 border border-white/10 rounded-md bg-[#0c0c0c]/80">
                <span class="text-[10px] text-mono-500 col-span-2 text-center py-4">Loading wallpapers from GitHub...</span>
              </div>
            </div>

          </div>
        `;

        const loopBtn = document.getElementById('loopToggleBtn');
        loopBtn.addEventListener('click', () => {
          let loopState = localStorage.getItem('fruitiger_video_loop') !== 'false';
          let newState = !loopState;
          localStorage.setItem('fruitiger_video_loop', newState);
          loopBtn.textContent = newState ? 'ENABLED' : 'DISABLED';

          let currentWall = localStorage.getItem('fruitiger_wallpaper');
          if (currentWall && currentWall.toLowerCase().endsWith('.mp4')) {
            applyWallpaper(currentWall, true, newState);
          }
        });

        document.getElementById('bgDefaultBtn').addEventListener('click', () => {
          applyWallpaper('', false, true);
        });

        fetch('https://api.github.com/repos/school-rgb/frutiger-pr0xy-wallpapers/contents')
          .then(res => {
            if (!res.ok) throw new Error('API Blocked');
            return res.json();
          })
          .then(data => {
            const grid = document.getElementById('githubWallpapersGrid');
            if (!Array.isArray(data)) {
              grid.innerHTML = '<span class="text-[10px] text-mono-500 col-span-2 text-center py-4">Unable to load wallpapers.</span>';
              return;
            }

            const mediaFiles = data.filter(file => {
              const name = file.name.toLowerCase();
              return name.endsWith('.png') || name.endsWith('.jpg') || name.endsWith('.jpeg') || name.endsWith('.webp') || name.endsWith('.mp4');
            });

            if (mediaFiles.length === 0) {
              grid.innerHTML = '<span class="text-[10px] text-mono-500 col-span-2 text-center py-4">No wallpapers found in repo.</span>';
              return;
            }

            grid.innerHTML = '';
            mediaFiles.forEach(file => {
              const fileUrl = file.download_url;
              const isVideo = file.name.toLowerCase().endsWith('.mp4');

              const thumbDiv = document.createElement('div');
              thumbDiv.className = 'relative h-20 glass-card rounded overflow-hidden cursor-pointer hover:border-white transition-all flex items-center justify-center group';
              
              if (isVideo) {
                thumbDiv.innerHTML = `<video src="${fileUrl}" class="w-full h-full object-cover"></video>`;
              } else {
                thumbDiv.innerHTML = `<img src="${fileUrl}" class="w-full h-full object-cover">`;
              }

              thumbDiv.addEventListener('click', () => {
                let loopState = localStorage.getItem('fruitiger_video_loop') !== 'false';
                applyWallpaper(fileUrl, isVideo, loopState);
              });

              grid.appendChild(thumbDiv);
            });
          })
          .catch(() => {
            const grid = document.getElementById('githubWallpapersGrid');
            if (grid) {
              grid.innerHTML = '<span class="text-[10px] text-mono-400 col-span-2 text-center py-4 px-2">School Wi-Fi restrictions detected. GitHub API requests are blocked. Default particle backgrounds and custom cloaks remain fully functional.</span>';
            }
          });

        document.getElementById('presetGoogle').addEventListener('click', () => {
          updateTabInfo('Google', 'https://www.google.com/favicon.ico');
        });
        document.getElementById('presetDrive').addEventListener('click', () => {
          updateTabInfo('My Drive - Google Drive', 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png');
        });
        document.getElementById('presetCanvas').addEventListener('click', () => {
          updateTabInfo('Dashboard', 'https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico');
        });
        document.getElementById('applyTabCustom').addEventListener('click', () => {
          updateTabInfo(document.getElementById('tabTitleInput').value, document.getElementById('tabIconInput').value);
        });
      }

      navButtons.forEach((btn, index) => {
        btn.addEventListener('click', () => setNavIndex(index));
        btn.addEventListener('mouseenter', () => {
          tooltipText.textContent = btn.getAttribute('data-subtitle');
          const btnRect = btn.getBoundingClientRect();
          tooltip.style.top = `${btnRect.top + (btnRect.height / 2) - 12}px`;
          tooltip.classList.remove('opacity-0', 'pointer-events-none');
          tooltip.classList.add('opacity-100');
        });
        btn.addEventListener('mouseleave', () => {
          tooltip.classList.add('opacity-0', 'pointer-events-none');
          tooltip.classList.remove('opacity-100');
        });
      });

      setNavIndex(0);
    });

      const parent = imgElement.parentElement;
      if (parent && svgs[type]) parent.innerHTML = svgs[type];
    }
  </script>

      const el = document.getElementById('adsmCursor');
      let cur = '', hx = 0, hy = 0;
      function set(k) {
        if (k === cur || !C[k]) return;
        cur = k; const d = C[k];
        const img = new Image();
        img.onload = () => { el.style.width = img.width + 'px'; el.style.height = img.height + 'px'; };
        img.src = d[0];
        el.style.backgroundImage = 'url(' + d[0] + ')'; hx = d[1]; hy = d[2];
      }
      function kind(t) {
        if (!t || !t.closest) return 'arrow';
        if (t.closest('#appLoader')) return 'busy';
        if (t.closest('button:disabled, [disabled]')) return 'no';
        if (t.closest('input:not([type=button]):not([type=checkbox]):not([type=range]):not([type=radio]):not([type=submit]), textarea, [contenteditable=""], [contenteditable="true"]')) return 'text';
        if (t.closest('a[href], button, select, summary, label, [role="button"], .cursor-pointer, #musicThumbBox, [onclick]')) return 'hand';
        return 'arrow';
      }
      function place(x, y, k) {
        el.style.display = 'block';
        set(k);
        el.style.transform = 'translate(' + (x - hx) + 'px,' + (y - hy) + 'px)';
      }
      set('arrow');

      // Mouse over the page itself
      window.addEventListener('mousemove', e => {
        if (e.target && e.target.tagName === 'IFRAME') return; // handled by the iframe bridge below
        place(e.clientX, e.clientY, kind(e.target));
      }, true);
      document.addEventListener('mouseleave', () => { el.style.display = 'none'; });

        try {
          const st = doc.createElement('style'); st.textContent = hiddenStyle;
          (doc.head || doc.documentElement).appendChild(st);
          doc.addEventListener('mousemove', e => {
            const r = f.getBoundingClientRect();
            place(r.left + e.clientX, r.top + e.clientY, kind(e.target));
          }, true);
          doc.addEventListener('mouseleave', () => { el.style.display = 'none'; });
        } catch (e) {}
      }
      function watchFrame(f) {
        const go = () => { hookFrame(f); };
        f.addEventListener('load', go);
        // pages navigate inside the iframe, so re-hook while it is on screen
        setInterval(go, 500);
      }
      new MutationObserver(ms => {
        ms.forEach(m => m.addedNodes.forEach(n => {
          if (n.nodeType !== 1) return;
          if (n.tagName === 'IFRAME') watchFrame(n);
          else if (n.querySelectorAll) n.querySelectorAll('iframe').forEach(watchFrame);
        }));
      }).observe(document.body, { childList: true, subtree: true });

      // Cross-origin apps can opt in: they post {type:'fruiti-cursor', x, y, kind} with coords relative to their own viewport
      window.addEventListener('message', e => {
        const d = e.data;
        if (!d || d.type !== 'fruiti-cursor') return;
        const f = Array.from(document.querySelectorAll('iframe')).find(i => i.contentWindow === e.source);
        if (!f) return;
        if (d.hide) { el.style.display = 'none'; return; }
        const r = f.getBoundingClientRect();
        place(r.left + (+d.x || 0), r.top + (+d.y || 0), d.kind || 'arrow');
      });
    })();
  </script>
</body>
</html>
